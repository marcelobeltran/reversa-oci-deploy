name: Validar Reversa OCI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - run: pip install -r runtime/requirements.txt
      - run: python scripts/package.py
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: bash -n runtime/install.sh && bash -n runtime/certificate.sh
      - run: python -m unittest discover -s runtime/portal -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: reversa-resource-manager
          path: |
            reversa-resource-manager.zip
            reversa-prueba.zip
            SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/reversa-console-v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reversa-resource-manager
          path: release-assets
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, name: 'Reversa: instalación desde OCI (' + tag + ')',
              body: 'Descarga reversa-resource-manager.zip para Resource Manager. La guía principal está en docs/02-tenant-nuevo.md. reversa-prueba.zip sirve para probar el portal. SHA256SUMS permite comprobar ambos archivos. Base: Reversa 1.3.4, OpenCode 1.19.0. Asistente Cloud Shell verificado con pruebas SDK simuladas; no equivale a otro despliegue end-to-end en tenant limpio.'
            });
            for (const name of ['reversa-resource-manager.zip', 'reversa-prueba.zip', 'SHA256SUMS']) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: release.data.id, name,
                data: fs.readFileSync('release-assets/' + name)
              });
            }
