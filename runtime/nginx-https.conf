map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/reversa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reversa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic 'Reversa';
    auth_basic_user_file /etc/nginx/reversa.htpasswd;
    client_max_body_size 105m;
    add_header X-Content-Type-Options nosniff always;
    location = /proyectos { return 308 /proyectos/; }
    location /proyectos/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_set_header X-Forwarded-Prefix /proyectos;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
