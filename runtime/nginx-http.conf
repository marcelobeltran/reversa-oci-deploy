server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reversa-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /healthz { access_log off; return 200 'reversa-edge\n'; }
    location / { return 404; }
}
